services:
  - type: web
    name: discord-mute-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: ROBLOX_API_KEY
        sync: false
      - key: ROBLOX_UNIVERSE_ID
        sync: false
